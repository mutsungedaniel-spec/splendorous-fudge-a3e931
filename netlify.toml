headersOrigin = "config"
plugins = []
redirects = []

[functions]

  [functions."*"]

[build]

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[headers]]
for = "/*.html"

  [headers.values]
  Cache-Control = "public, max-age=0, no-cache, must-revalidate"

[[headers]]
for = "/"

  [headers.values]
  Cache-Control = "public, max-age=0, no-cache, must-revalidate"